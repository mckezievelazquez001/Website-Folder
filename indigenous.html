<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indigenous Studies - Mckenzie Velazquez</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a class="name" href="index.html">Mckenzie Velazquez</a>
        <div class="nav-links">
            <a href="artwork.html" class="active">Work</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    <main class="gallery-page">
        <h1>Indigenous Studies</h1>
        <div class="slideshow">
            <button class="gallery-arrow previous" aria-label="Previous photograph" onclick="changePhoto(-1)">&#10094;</button>
            <img id="gallery-photo" src="Website-Portfolio-Indigenous Gatherings-Mckenzie Velazquez .jpg" alt="Indigenous Studies">
            <button class="gallery-arrow next" aria-label="Next photograph" onclick="changePhoto(1)">&#10095;</button>
        </div>
        <div class="thumbnails" id="thumbnails"></div>
        <a class="back-link" href="artwork.html">Back to Work</a>
    </main>
    <script>
        const photos = [
            "Website-Portfolio-Indigenous Gatherings-Mckenzie Velazquez .jpg",
            "homepagee1artwork.jpg",
            "printmakig72dpi.jpg",
            "tipi72dpi.jpg",
            "Mckenzie_Velazquez_WebDesign_Portflio.jpg"
        ];
        let currentPhoto = 0;
        const galleryPhoto = document.getElementById("gallery-photo");
        const thumbnails = document.getElementById("thumbnails");

        photos.forEach((photo, index) => {
            const button = document.createElement("button");
            button.className = "thumbnail";
            button.setAttribute("aria-label", "View artwork " + (index + 1));
            const image = document.createElement("img");
            image.src = photo;
            image.alt = "Indigenous Studies " + (index + 1);
            button.appendChild(image);
            button.onclick = () => showPhoto(index);
            thumbnails.appendChild(button);
        });

        function showPhoto(index) {
            currentPhoto = (index + photos.length) % photos.length;
            galleryPhoto.src = photos[currentPhoto];
            galleryPhoto.alt = "Indigenous Studies " + (currentPhoto + 1);
            document.querySelectorAll(".thumbnail").forEach((thumbnail, i) => {
                thumbnail.classList.toggle("selected", i === currentPhoto);
            });
        }

        function changePhoto(direction) {
            showPhoto(currentPhoto + direction);
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowLeft") changePhoto(-1);
            if (event.key === "ArrowRight") changePhoto(1);
        });

        showPhoto(0);
    </script>
</body>
</html>
