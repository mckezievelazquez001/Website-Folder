<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New York - Mckenzie Velazquez</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a class="name" href="index.html">Mckenzie Velazquez</a>
        <div class="nav-links">
            <a href="artwork.html" class="active">Work</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    <main class="gallery-page">
        <h1>New York</h1>
        <div class="slideshow">
            <button class="gallery-arrow previous" onclick="changePhoto(-1)" aria-label="Previous photograph">&#10094;</button>
            <img id="gallery-photo" src="72dpiDSC05048 copy.jpg" alt="New York photograph">
            <button class="gallery-arrow next" onclick="changePhoto(1)" aria-label="Next photograph">&#10095;</button>
        </div>
        <div id="thumbnails" class="thumbnails"></div>
        <a class="back-link" href="artwork.html">Back to Work</a>
    </main>
    <script>
        const photos = [
            "72dpiDSC05048 copy.jpg",
            "72dpiDSC05488 copy.jpg",
            "72dpiiDSC05056 copy.jpg",
            "blackandwhite72dpi.jpg"
        ];
        let currentPhoto = 0;
        function showPhoto(index) {
            currentPhoto = index;
            document.getElementById("gallery-photo").src = photos[index];
            document.querySelectorAll(".thumbnail").forEach((thumb, i) => {
                thumb.classList.toggle("selected", i === index);
            });
        }
        function changePhoto(direction) {
            currentPhoto = (currentPhoto + direction + photos.length) % photos.length;
            showPhoto(currentPhoto);
        }
        photos.forEach((src, index) => {
            const button = document.createElement("button");
            button.className = "thumbnail";
            const img = document.createElement("img");
            img.src = src;
            img.alt = "New York photograph " + (index + 1);
            button.appendChild(img);
            button.onclick = () => showPhoto(index);
            document.getElementById("thumbnails").appendChild(button);
        });
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowLeft") changePhoto(-1);
            if (event.key === "ArrowRight") changePhoto(1);
        });
        showPhoto(0);
    </script>
</body>
</html>
