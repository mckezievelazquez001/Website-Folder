<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New York - Mckenzie Velazquez</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a class="name" href="index.html">Mckenzie Velazquez</a>
        <div class="nav-links">
            <a href="artwork.html" class="active">Work</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    <main class="gallery-page">
        <h1>New York</h1>
        <div class="slideshow">
            <button class="gallery-arrow previous" onclick="changePhoto(-1)">&#10094;</button>
            <img id="gallery-photo" src="72dpiDSC05048 copy.jpg" alt="New York">
            <button class="gallery-arrow next" onclick="changePhoto(1)">&#10095;</button>
        </div>
        <div class="thumbnails">
            <button class="thumbnail selected" onclick="showPhoto(0)">
                <img src="72dpiDSC05048 copy.jpg" alt="Photograph 1">
            </button>
            <button class="thumbnail" onclick="showPhoto(1)">
                <img src="72dpiDSC05488 copy.jpg" alt="Photograph 2">
            </button>
            <button class="thumbnail" onclick="showPhoto(2)">
                <img src="72dpiiDSC05056 copy.jpg" alt="Photograph 3">
            </button>
            <button class="thumbnail" onclick="showPhoto(3)">
                <img src="blackandwhite72dpi.jpg" alt="Photograph 4">
            </button>
        </div>
        <a class="back-link" href="artwork.html">Back to Work</a>
    </main>
    <script>
        const photos = [
            "72dpiDSC05048 copy.jpg",
            "72dpiDSC05488 copy.jpg",
            "72dpiiDSC05056 copy.jpg",
            "blackandwhite72dpi.jpg"
        ];
        let currentPhoto = 0;
        function showPhoto(index) {
            currentPhoto = index;
            document.getElementById("gallery-photo").src = photos[index];
            document.querySelectorAll(".thumbnail").forEach((thumb, i) => {
                thumb.classList.toggle("selected", i === index);
            });
        }
        function changePhoto(direction) {
            currentPhoto = (currentPhoto + direction + photos.length) % photos.length;
            showPhoto(currentPhoto);
        }
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowLeft") changePhoto(-1);
            if (event.key === "ArrowRight") changePhoto(1);
        });
    </script>
</body>
</html>
